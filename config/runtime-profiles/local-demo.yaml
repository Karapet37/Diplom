profile: local-demo
description: Fast local demo profile with reduced budgets and quieter background work for responsive operator demos.
env:
  WEB_HOST: 127.0.0.1
  WEB_PORT: "8008"
  COGNITIVE_MEMORY_ROOT: runtime/local-demo/memory
  COGNITIVE_ENABLE_FRONTEND_ROOT: "1"
  COGNITIVE_ENABLE_FRONTEND_ASSETS: "1"
  COGNITIVE_ENABLE_BACKGROUND_REBUILD: "0"
  COGNITIVE_MAX_CONTEXT_TOKENS: "3200"
  COGNITIVE_GRAPH_SUBGRAPH_LIMIT: "8"
  COGNITIVE_BACKGROUND_REBUILD_INTERVAL: "12"
  COGNITIVE_CHAT_ROLE: analyst
  COGNITIVE_EXTRACTION_ROLE: analyst
  COGNITIVE_PERSONA_ROLE: analyst
  COGNITIVE_RETHINK_ROLE: analyst
  COGNITIVE_TRANSLATION_ROLE: translator
