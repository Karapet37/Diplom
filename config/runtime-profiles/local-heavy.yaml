profile: local-heavy
description: Local-first heavy profile with larger context and graph windows for stronger retrieval at the cost of latency and memory.
env:
  WEB_HOST: 127.0.0.1
  WEB_PORT: "8008"
  COGNITIVE_MEMORY_ROOT: runtime/local-heavy/memory
  COGNITIVE_ENABLE_FRONTEND_ROOT: "1"
  COGNITIVE_ENABLE_FRONTEND_ASSETS: "1"
  COGNITIVE_ENABLE_BACKGROUND_REBUILD: "1"
  COGNITIVE_MAX_CONTEXT_TOKENS: "5200"
  COGNITIVE_PERSONA_BLOCK_BUDGET: "1500"
  COGNITIVE_GRAPH_CONTEXT_BUDGET: "2300"
  COGNITIVE_RECENT_DIALOGUE_BUDGET: "900"
  COGNITIVE_GRAPH_SUBGRAPH_LIMIT: "14"
  COGNITIVE_BACKGROUND_REBUILD_INTERVAL: "4"
  COGNITIVE_CHAT_ROLE: general
  COGNITIVE_EXTRACTION_ROLE: analyst
  COGNITIVE_PERSONA_ROLE: analyst
  COGNITIVE_RETHINK_ROLE: analyst
  COGNITIVE_TRANSLATION_ROLE: translator
